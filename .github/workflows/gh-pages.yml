name: GitHub Pages

on:
  push:
    # This ensures it triggers on your specific branch
    branches:
      - "Hugo+Vue.js" 
  # This allows you to manually trigger it from the "Actions" tab to test
  workflow_dispatch: 

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true 

      - name: Build
        # We move into the blog directory to run the build command
        run: |
          cd blog
          hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        # This condition ensures it only deploys when pushing to your branch
        if: github.ref == 'refs/heads/Hugo+Vue.js'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # Points to the public folder inside your blog folder
          publish_dir: ./blog/public
