baseURL = "https://ondrejhonus.com"
languageCode = "en-us"
title = "Ondřej Honus' website"
theme = "vintage-web-hugo-them"
licence = "GPL"

# Pagination
[pagination]
  pagerSize = 10
  path = "page"

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Menu
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 20

[[menu.main]]
  name = "Apps"
  url = "/apps/"
  weight = 30

[[menu.main]]
  name = "Snippets"
  url = "/snippets/"
  weight = 40

#[[menu.main]]
#  name = "About"
#  url = "/about/"
#  weight = 30

# Theme Parameters
[params]
  # Site Description
  description = "Ondřej Honus' website"
  author = "Ondřej Honus"


  # Retro Features
  show_browser_chrome = true
  show_status_bar = true
  show_sidebar = true
  show_welcome_message = true
  welcome_message = "Go check out my git command manager!"

  # Content Display
  show_featured_sections = true
  show_stats = true
  show_retro_elements = false
  show_sharing = true

  # Footer Options
  show_retro_footer = true
  show_build_info = false

  # Sidebar Options
  show_sidebar_stats = false
  show_retro_sidebar = true
  sidebar_content = "Welcome to my website!"

  # Social Links
  [params.social]
    github = "ondrejhonus"
    linkedin = "ondřej-honus-42405935a"
    email = "ondrejhonus@pm.me"

  # SEO and Analytics
  google_analytics = "G-XXXXXXXXXX"

  # Repository (for edit links)
  repo_url = "https://github.com/ondrejhonus/personal-website"
  edit_page = true